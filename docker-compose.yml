services:
  db:
    image: postgres:16-alpine
    container_name: mywebapp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mywebapp_db
      POSTGRES_USER: mywebapp
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mywebapp_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mywebapp -d mywebapp_db']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  webapp:
    image: mywebapp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mywebapp_app
    restart: unless-stopped
    environment:
      CONFIG_PATH: /etc/mywebapp/config.json
      APP_HOST: '0.0.0.0'
      APP_PORT: '8080'
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: mywebapp
      DB_PASSWORD: mypassword
      DB_NAME: mywebapp_db
    networks:
      - mywebapp_net
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '8080'

  nginx:
    image: nginx:1.27-alpine
    container_name: mywebapp_nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mywebapp_net
    depends_on:
      - webapp

networks:
  mywebapp_net:
    driver: bridge
    name: mywebapp_net

volumes:
  postgres_data:
    name: mywebapp_postgres_data
